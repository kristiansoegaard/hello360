name: Build hello360

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to attach files to releases

env:
  DEVKITXENON: /usr/local/xenon

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget texinfo flex bison \
            libgmp-dev libmpfr-dev libmpc-dev libssl-dev zlib1g-dev libncurses-dev

      # The toolchain takes a long time to build, so cache it.
      # The first run is slow; later runs reuse the cache.
      - name: Restore toolchain cache
        id: cache
        uses: actions/cache@v4
        with:
          path: /usr/local/xenon
          key: libxenon-toolchain-v1

      - name: Build libxenon toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p $DEVKITXENON
          sudo chown $USER $DEVKITXENON
          git clone https://github.com/Free60Project/libxenon.git /tmp/libxenon
          cd /tmp/libxenon/toolchain
          ./build-xenon-toolchain toolchain
          ./build-xenon-toolchain libxenon

      - name: Build hello360
        run: |
          export PATH=$PATH:$DEVKITXENON/bin
          make

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: hello360.elf32
          path: hello360.elf32

      # Pushing a tag like v0.1.0 also publishes a GitHub release
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: hello360.elf32
          prerelease: true
